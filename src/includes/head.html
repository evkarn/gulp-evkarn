<head
	itemscope
	itemtype="http://schema.org/WPHeader"
>
	<title itemprop="name">@title</title>

	<meta charset="utf-8">

	<base href="/">

	<meta
		http-equiv="X-UA-Compatible"
		content="ie=edge"
	>

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	>

	<meta
		itemprop="description"
		name="description"
		content="@description"
	>

	<meta
		itemprop="keywords"
		name="keywords"
		content="@keywords"
	>

	<!-- Template Basic Images Start -->
	<link
		rel="apple-touch-icon"
		sizes="180x180"
		href="apple-touch-icon.png"
	>

	<link
		rel="icon"
		type="image/x-icon"
		href="favicon.ico"
	>

	<link
		rel="icon"
		type="image/svg+xml"
		sizes="120x120"
		href="favicon.svg"
	>

	<link
		rel="icon"
		type="image/png"
		sizes="32x32"
		href="assets/favicon/favicon-32x32.png"
	>

	<link
		rel="icon"
		type="image/png"
		sizes="16x16"
		href="assets/favicon/favicon-16x16.png"
	>

	<link
		rel="manifest"
		href="assets/favicon/site.webmanifest"
	>

	<link
		rel="mask-icon"
		href="assets/favicon/safari-pinned-tab.svg"
		color="#e8b217"
	>

	<meta
		name="msapplication-TileColor"
		content="#2b5797"
	>

	<meta
		name="theme-color"
		content="#e8b217"
	>
	<!-- /Template Basic Images End -->

	<!--Open Graph-->
	<meta
		property="og:site_name"
		content="@title"
	>

	<meta
		property="og:url"
		content="@siteUrl"
	>

	<meta
		property="og:type"
		content="website"
	>

	<meta
		property="og:title"
		content="@title"
	>

	<meta
		property="og:description"
		content="@description"
	>

	<meta
		property="og:image"
		content="assets/images/social-images/og-images/@ogImage.jpg"
	>

	<meta
		property="og:locale"
		content="ru_Ru"
	>

	<meta
		name="twitter:card"
		content="summary_large_image"
	>

	<meta
		name="twitter:title"
		content="@title"
	>

	<meta
		name="twitter:description"
		content="@description"
	>

	<meta
		name="twitter:site"
		content="@siteUrl"
	>

	<meta
		name="twitter:image"
		content="assets/images/social-images/og-images/@ogImage.jpg"
	>
	<!--/Open Graph-->

	<!-- Schema-org -->
	<meta
		itemprop="name"
		content="@title"
	>

	<meta
		itemprop="description"
		content="@description"
	>

	<meta
		itemprop="image"
		content="assets/images/social-images/og-images/@ogImage.jpg"
	>

	<div
		itemscope
		itemtype="https://schema.org/ImageObject"
	>

		<a
			href="https://ics-media.ru/"
			rel="home"
		>
			<img
				itemprop="url image"
				src="https://ics-media.ru/images/logo.png"
				alt="Логотип Increase Sales"
			>
		</a>
	</div>
	<!-- /Schema-org -->

	<link
		rel="preload"
		href="assets/fonts/Roboto.woff2"
		as="font"
		type="font/woff2"
		crossorigin
	>

	<link
		itemprop="cssSelector"
		rel="stylesheet"
		href="assets/css/@css.min.css"
	>
</head>
