<header class="header">
	<div class="header__container container">
		<a
			href="#"
			class="header__logo logo"
		>
			<img
				class="logo__image"
				src="assets/images/dist/sprite-svg/sprite.svg#logo"
				width="166"
				height="30"
				alt="@alt"
			/>
		</a>

		<nav
			class="header__nav nav"
			data-nav
		>
			<ul
				class="menu"
				data-menu
				itemscope
				itemtype="https://schema.org/SiteNavigationElement"
			>
				<li
					class="menu-item"
					data-menu-item
				>
					<a
						class="menu-link"
						href="#"
						data-menu-link
						itemprop="url"
					>
						Пункт 1
					</a>
				</li>

				<li
					class="menu-item"
					data-menu-item
				>
					<a
						class="menu-link"
						href="#"
						data-menu-link
						itemprop="url"
					>
						Пункт 1
					</a>

					<ul
						class="sub-menu"
						data-sub-menu
					>
						<li
							class="menu-item"
							data-sub-menu-item
						>
							<a
								class="menu-link"
								href="#"
								data-sub-menu-link
								itemprop="url"
							>
								Внутренний пункт 1
							</a>
						</li>
					</ul>
				</li>
			</ul>
		</nav>

		<button
			class="burger btn-res"
			data-burger
			aria-label="Открыть меню"
			aria-expanded="false"
		>
			<span class="burger__line"></span>
		</button>
	</div>
</header>
