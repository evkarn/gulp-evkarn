<header class="header">
	<div class="header__container container">
		<a
			href="#"
			class="header__logo logo"
		>
			<img
				class="logo__image"
				src="assets/images/dist/sprite-svg/sprite.svg#logo"
				width="166"
				height="30"
				alt="@alt"
			>
		</a>

		<nav
			class="header__nav nav"
			data-nav
		>
			<ul class="nav__list list-reset" itemscope itemtype="http://schema.org/SiteNavigationElement">
				<li class="nav__item">
					<a
						class="nav__link"
						href="#!"
						itemprop="url"
					>
						Пункт 1
					</a>
				</li>

				<li class="nav__item">
					<a
						class="nav__link"
						href="#!"
						itemprop="url"
					>
						Пункт 2
					</a>
				</li>

				<li class="nav__item">
					<a
						class="nav__link"
						href="#!"
						itemprop="url"
					>
						Пункт 3
					</a>
				</li>
			</ul>
		</nav>

		<button
			class="header__burger burger btn-reset"
			data-burger
			aria-label="Открыть меню"
			aria-expanded="false"
		>
			<span class="burger__line"></span>
		</button>
	</div>
</header>
