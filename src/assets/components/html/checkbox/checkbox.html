		<input
			class="checkbox__input"
			type="checkbox"
			id="first_solution"
			value="first_solution"
			name="solution"

			required

	<label class="checkbox__label">

			class="checkbox__input"
			type="checkbox"

			name="solution"
			required
		>

		Второй чекбокс
	</label>
</fieldset>
