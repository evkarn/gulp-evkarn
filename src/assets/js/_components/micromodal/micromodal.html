<div class="modal micromodal-slide" id="modal-1" aria-hidden="true">
	<div class="modal__overlay" tabindex="-1" data-modal-close>
		<div
			class="modal__container"
			role="dialog"
			aria-modal="true"
			aria-labelledby="modal-1-title"
			aria-describedby="modal-1-description"
		>
			<div role="document">
				<div class="modal__header">
					<h2 class="modal__title" id="modal-1-title">Модальное окно Micromodal</h2>

					<p class="modal__description" id="modal-1-description">
						Это модальное окно Micromodal содержит в себе форму заказа обратного звонка
					</p>

					<button
						class="modal__close"
						aria-label="Закрыть модальное окно"
						data-modal-close
					></button>
				</div>

				<div class="modal__main">
					<p>
						Try hitting the <code>tab</code> key and notice how the focus stays within the modal
						itself. Also, <code>esc</code> to close modal.
					</p>
				</div>

				<div class="modal__footer">
					<button class="modal__btn modal__btn-primary">Continue</button>

					<button class="modal__btn" data-modal-close aria-label="Close this dialog window">
						Close
					</button>
				</div>
			</div>
		</div>
	</div>
</div>
