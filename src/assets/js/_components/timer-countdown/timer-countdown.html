<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>

<body>

	<div class="timer-countdown">
		<h2 class="timer-countdown__title">
			До Нового года осталось
		</h2>

		<div class="timer-countdown__content">
			<div class="timer-countdown__item timer-countdown__days" data-days>
				<div class="timer-countdown__val" data-days-val>00</div>
				<span class="timer-countdown__text" data-days-text>дней</span>
			</div>

			<div class="timer-countdown__separator">:</div>

			<div class="timer-countdown__item timer-countdown__hours" data-hours>
				<div class="timer-countdown__val" data-hours-val>00</div>
				<span class="timer-countdown__text" data-hours-text>часов</span>
			</div>

			<div class="timer-countdown__separator">:</div>

			<div class="timer-countdown__item timer-countdown__minutes" data-minutes>
				<div class="timer-countdown__val" data-minutes-val>00</div>
				<span class="timer-countdown__text" data-minutes-text>минут</span>
			</div>

			<div class="timer-countdown__separator">:</div>

			<div class="timer-countdown__item timer-countdown__seconds" data-seconds>
				<div class="timer-countdown__val" data-seconds-val>00</div>
				<span class="timer-countdown__text" data-seconds-text>секунд</span>
			</div>
		</div>
	</div>

</body>

</html>
