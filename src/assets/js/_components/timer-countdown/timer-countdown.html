<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>

<body>

	<div class="time-count">
		<h2 class="time-count__title">
			До Нового года осталось
		</h2>

		<div class="time-count__content">
			<div class="time-count__item time-count__days" data-days>
				<div class="time-count__val" data-days-val>00</div>
				<span class="time-count__text" data-days-text>дней</span>
			</div>

			<div class="time-count__separator">:</div>

			<div class="time-count__item time-count__hours" data-hours>
				<div class="time-count__val" data-hours-val>00</div>
				<span class="time-count__text" data-hours-text>часов</span>
			</div>

			<div class="time-count__separator">:</div>

			<div class="time-count__item time-count__minutes" data-minutes>
				<div class="time-count__val" data-minutes-val>00</div>
				<span class="time-count__text" data-minutes-text>минут</span>
			</div>

			<div class="time-count__separator">:</div>

			<div class="time-count__item time-count__seconds" data-seconds>
				<div class="time-count__val" data-seconds-val>00</div>
				<span class="time-count__text" data-seconds-text>секунд</span>
			</div>
		</div>
	</div>

</body>

</html>
