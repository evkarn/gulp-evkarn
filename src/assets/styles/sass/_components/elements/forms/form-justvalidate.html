<form class="content__form form form-message" action="#" method="POST">
	<fieldset class="form__fieldset">
		<label class="form__label label" for="name-form-message">
			Имя<span class="label__req">*</span>
		</label>

		<input class="form__input form-control input input--name" type="text" data-validate-field="name" name="Имя" id="name-form-message" placeholder="Введите имя" required>
	</fieldset>

	<fieldset class="form__fieldset">
		<label class="form__label label" for="phone-form-message">
			Контактный телефон<span class="label__req">*</span>
		</label>

			<input class="form__input form-control input input--tel" id="phone-form-message" type="tel" data-validate-field="tel" name="Телефон" placeholder="Номер телефона" required>
	</fieldset>

	<fieldset class="form__fieldset">
		<label class="form__label label" for="email-form-message">
			E-mail
		</label>

		<input class="form__input form-control input input--mail" id="email-form-message" type="email" data-validate-field="email" name="Email" placeholder="Введите email">
	</fieldset>

	<fieldset class="form__fieldset">
		<label class="form__label label">
			Сообщение<span class="label__req">*</span>
		</label>

		<textarea class="form__textarea textarea" id="message-form-message" name="Сообщение" cols="30" rows="6" placeholder="Текст сообщения" required></textarea>
	</fieldset>

	<fieldset class="form__fieldset">
		<input class="form__input input" type="file" name="file[]" multiple id="myfile">
	</fieldset>

	<button type="submit" class="form__button" id="btn-form-message">
		Отправить
	</button>

	<p class="form__alert">
		Нажимая на кнопку «Отправить», вы соглашаетесь с условиями обработки персональных данных и <a class="form__link" href="#">Политикой конфиденциальности</a>
	</p>
</form>
